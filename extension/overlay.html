<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>20-20-20 Eye Break</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      max-width: 320px;
      width: 100%;
      padding: 20px;
    }
    .tip { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .tip-emoji { font-size: 24px; animation: bounce 2s infinite; }
    .tip-text { font-size: 13px; color: #b0bec5; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

    .ring-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 16px; }
    .ring { width: 120px; height: 120px; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: #2a2a4a; stroke-width: 6; }
    .ring-fg { fill: none; stroke: url(#grad); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .ring-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
    .time { font-size: 36px; font-weight: 700; color: #4fc3f7; }
    .unit { font-size: 12px; color: #78909c; }

    .breathe { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
    .breathe-ring { width: 60px; height: 60px; border: 3px solid rgba(79,195,247,0.3); border-radius: 50%; animation: breathe 2s infinite; }
    .breathe-text { font-size: 11px; color: #4fc3f7; margin-top: 4px; }
    @keyframes breathe { 0%,100%{transform:scale(0.8);opacity:0.4} 50%{transform:scale(1.3);opacity:0.8} }

    .btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg,#4fc3f7,#26a69a);
      border: none; border-radius: 24px; color: #1a1a2e; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 16px;
    }
    .btn:hover { transform: scale(1.05); }
    .close { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #546e7a; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <button class="close" id="close">✕</button>
  <div class="tip">
    <span class="tip-emoji" id="emoji">🌳</span>
    <span class="tip-text" id="tipText">休息一下！</span>
  </div>

  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4fc3f7"/>
          <stop offset="100%" stop-color="#66bb6a"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="60" cy="60" r="48"/>
      <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="48"/>
    </svg>
    <div class="ring-content">
      <div class="time" id="time">20</div>
      <div class="unit">秒</div>
    </div>
    <div class="breathe" id="breathe">
      <div class="breathe-ring"></div>
      <div class="breathe-text">深呼吸</div>
    </div>
  </div>

  <button class="btn" id="done">✓ 已完成，去休息</button>

  <script src="overlay.js"></script>
</body>
</html>
